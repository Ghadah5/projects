<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق بخطوتين — سياق</title>
    <link rel="stylesheet" href="/frontend/style.css">
    <style>
        :root {
            --blue:      #00b4ff;
            --blue-dim:  rgba(0,180,255,0.12);
            --green:     #3fb950;
            --green-dim: rgba(63,185,80,0.15);
            --red:       #f85149;
            --red-dim:   rgba(248,81,73,0.12);
            --surface2:  rgba(255,255,255,0.04);
            --border:    rgba(0,180,255,0.15);
        }

        /* ── MFA wrapper ── */
        .mfa-wrapper {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ── Card ── */
        .mfa-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,180,255,0.14);
            border-radius: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 0 1px rgba(0,180,255,0.05), 0 32px 64px rgba(0,0,0,0.5);
            overflow: hidden;
            animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes cardIn {
            from { opacity:0; transform:translateY(24px) scale(.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        /* ── Card header ── */
        .card-header {
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(0,180,255,0.1);
        }

        .shield-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .shield-bg {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: var(--blue-dim);
            border: 1px solid rgba(0,180,255,0.25);
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1;
            animation: shieldPulse 3s ease-in-out infinite;
        }

        @keyframes shieldPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,180,255,0); }
            50%      { box-shadow: 0 0 0 14px rgba(0,180,255,0.08); }
        }

        .shield-bg svg { width:36px; height:36px; fill:var(--blue); filter:drop-shadow(0 0 8px rgba(0,180,255,0.6)); }

        .orbit {
            position: absolute;
            width:88px; height:88px;
            border-radius:50%;
            border:1px dashed rgba(0,180,255,0.25);
            animation: spin 6s linear infinite;
        }
        .orbit::after {
            content:''; position:absolute;
            top:-4px; left:50%;
            width:8px; height:8px;
            background:var(--blue); border-radius:50%;
            box-shadow:0 0 8px var(--blue);
            transform:translateX(-50%);
        }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        .card-title { font-size:1.35rem; font-weight:900; color:#fff; margin-bottom:.4rem; }
        .card-subtitle { font-size:.88rem; color:rgba(255,255,255,0.5); line-height:1.6; }

        .email-badge {
            display:inline-flex; align-items:center; gap:.5rem;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(0,180,255,0.2);
            border-radius:100px; padding:6px 16px;
            margin-top:.8rem; font-size:.82rem; color:rgba(255,255,255,0.5);
        }
        .email-badge .dot {
            width:7px; height:7px; background:var(--green);
            border-radius:50%; box-shadow:0 0 6px var(--green);
            animation:blinkDot 2s ease-in-out infinite; flex-shrink:0;
        }
        @keyframes blinkDot { 0%,100%{opacity:1} 50%{opacity:.3} }
        .email-badge strong { color:var(--blue); font-weight:600; }

        /* ── Card body ── */
        .card-body { padding:2rem; }

        /* ── Steps ── */
        .steps { display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem; }
        .step { display:flex; flex-direction:column; align-items:center; gap:4px; }
        .step-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; }
        .step.done .step-dot  { background:var(--green-dim); border:1.5px solid var(--green); color:var(--green); }
        .step.active .step-dot { background:var(--blue-dim); border:1.5px solid var(--blue); color:var(--blue); }
        .step-label { font-size:.65rem; color:rgba(255,255,255,0.35); }
        .step.done .step-label, .step.active .step-label { color:rgba(255,255,255,0.6); }
        .step-line { width:48px; height:1px; background:rgba(255,255,255,0.1); margin-bottom:14px; }
        .step-line.done { background:var(--green); opacity:.5; }

        /* ── Risk chip ── */
        .risk-chip { display:none; align-items:center; gap:.4rem; background:rgba(210,153,34,0.1); border:1px solid rgba(210,153,34,0.25); border-radius:20px; padding:4px 12px; font-size:.75rem; color:#d2993a; margin:0 auto 1rem; width:fit-content; }
        .risk-chip.show { display:flex; }

        /* ── Progress ── */
        .progress-wrap { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; margin-bottom:1.5rem; overflow:hidden; }
        .progress-bar  { height:100%; border-radius:2px; background:linear-gradient(90deg,#0057ff,#00b4ff); transition:width 1s linear; width:100%; }
        .progress-bar.expired { background:var(--red); }

        /* ── OTP label ── */
        .otp-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,0.3); margin-bottom:1rem; display:block; text-align:center; }

        /* ── OTP boxes ── */
        .otp-row { display:flex; gap:10px; justify-content:center; direction:ltr; margin-bottom:.5rem; }

        .otp-box {
            width:54px; height:64px; text-align:center;
            font-size:1.6rem; font-weight:700;
            font-family:'Cairo','Tajawal',sans-serif;
            background:rgba(255,255,255,0.05);
            border:1.5px solid rgba(0,180,255,0.2);
            border-radius:12px; color:var(--blue); outline:none;
            transition:border-color .2s,box-shadow .2s,transform .15s;
            caret-color:var(--blue);
        }
        .otp-box:focus  { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,180,255,0.12); transform:translateY(-2px); }
        .otp-box.filled { border-color:rgba(63,185,80,0.5); color:var(--green); background:var(--green-dim); }
        .otp-box.error  { border-color:rgba(248,81,73,0.5); color:var(--red); background:var(--red-dim); animation:shake .4s ease; }

        @keyframes shake {
            0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
            40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
        }

        /* ── Status ── */
        .status-msg { text-align:center; font-size:.85rem; min-height:22px; margin:.75rem 0; }
        .status-msg.error   { color:var(--red); }
        .status-msg.success { color:var(--green); }

        /* ── Button (reuse .btn from style.css) ── */
        #verifyBtn { margin-top:0; }

        /* ── Footer row ── */
        .footer-row { display:flex; align-items:center; justify-content:space-between; margin-top:1.2rem; flex-wrap:wrap; gap:.5rem; }
        #timerDisplay { font-size:.82rem; color:rgba(255,255,255,0.45); display:flex; align-items:center; gap:.4rem; }
        #timerDisplay .timer-num { font-variant-numeric:tabular-nums; color:rgba(255,255,255,0.8); font-weight:700; min-width:36px; display:inline-block; }
        #timerDisplay.expired .timer-num { color:var(--red); }
        #resendBtn { font-size:.82rem; color:var(--blue); background:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; display:none; }
        #resendBtn:hover { opacity:.75; }

        .back-link { display:block; text-align:center; margin-top:1.2rem; font-size:.85rem; color:var(--blue); text-decoration:none; opacity:.8; transition:opacity .2s; }
        .back-link:hover { opacity:1; }

        @media(max-width:480px){
            .otp-box{width:44px;height:54px;font-size:1.3rem;}
            .card-body{padding:1.5rem;}
        }
    </style>
</head>
<body>

<!-- ANIMATED BACKGROUND -->
<div class="page-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- TOP BAR — نفس باقي الصفحات -->
<header class="top-bar">
    <div class="top-bar-container">
        <div class="logo">
            <img src="/frontend/logo.png" alt="سياق" height="150">
        </div>
        <nav class="nav-links">
            <a href="/frontend/home.html" id="navHome">الرئيسية</a>
            <a href="/frontend/about.html" id="navAbout">عن سياق</a>
        </nav>
        <div class="top-actions">
            <button class="lang-btn" onclick="setLang('ar')">العربية</button>
            |
            <button class="lang-btn" onclick="setLang('en')">English</button>
        </div>
    </div>
</header>

<!-- MFA CARD -->
<div class="mfa-wrapper">
    <div class="mfa-card">

        <div class="card-header">
            <div class="shield-wrap">
                <div class="orbit"></div>
                <div class="shield-bg">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/></svg>
                </div>
            </div>
            <h1 class="card-title">التحقق بخطوتين</h1>
            <p class="card-subtitle">للتحقق من هويتك، أرسلنا رمزاً إلى</p>
            <div class="email-badge">
                <span class="dot"></span>
                <strong id="displayEmail">—</strong>
            </div>
        </div>

        <div class="card-body">

            <!-- Steps -->
            <div class="steps">
                <div class="step done">
                    <div class="step-dot">✓</div>
                    <span class="step-label">كلمة المرور</span>
                </div>
                <div class="step-line done"></div>
                <div class="step active">
                    <div class="step-dot">2</div>
                    <span class="step-label">رمز التحقق</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-dot">3</div>
                    <span class="step-label">الدخول</span>
                </div>
            </div>

            <!-- Risk chip -->
            <div class="risk-chip" id="riskChip">
                <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#d2993a"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span>نشاط غير معتاد تم اكتشافه</span>
            </div>

            <!-- Progress bar -->
            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- OTP -->
            <span class="otp-label">أدخل رمز التحقق المكوّن من 6 أرقام</span>
            <div class="otp-row">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric" autocomplete="one-time-code">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric">
                <input class="otp-box" maxlength="1" type="text" inputmode="numeric">
            </div>

            <div class="status-msg" id="statusMsg"></div>

            <button class="btn" id="verifyBtn">تحقق من الرمز</button>

            <div class="footer-row">
                <div id="timerDisplay">
                    <span>الرمز ينتهي خلال</span>
                    <span class="timer-num" id="timerNum">01:00</span>
                </div>
                <button id="resendBtn">إعادة إرسال الرمز</button>
            </div>

            <a href="/frontend/login.html" class="back-link">← العودة لتسجيل الدخول</a>
        </div>
    </div>
</div>

<script src="/frontend/lang.js"></script>
<script>
const userId    = parseInt(sessionStorage.getItem("otp_user_id")    || "0");
const attemptId = parseInt(sessionStorage.getItem("otp_attempt_id") || "0");
const userEmail = sessionStorage.getItem("otp_email")     || "";
const riskLevel = sessionStorage.getItem("otp_risk_level") || "";

document.getElementById("displayEmail").textContent = userEmail || "—";
if (riskLevel === "Medium" || riskLevel === "High") {
    document.getElementById("riskChip").classList.add("show");
}

const boxes       = document.querySelectorAll(".otp-box");
const verifyBtn   = document.getElementById("verifyBtn");
const resendBtn   = document.getElementById("resendBtn");
const timerNum    = document.getElementById("timerNum");
const timerDisp   = document.getElementById("timerDisplay");
const progressBar = document.getElementById("progressBar");

// ── OTP boxes ──
boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
        box.value = box.value.replace(/\D/g,"").slice(-1);
        box.classList.remove("error");
        box.classList.toggle("filled", box.value !== "");
        if (box.value && i < boxes.length-1) boxes[i+1].focus();
        if (getCode().length === 6) submitCode();
    });
    box.addEventListener("keydown", (e) => {
        if (e.key==="Backspace" && !box.value && i>0) {
            boxes[i-1].value=""; boxes[i-1].classList.remove("filled","error"); boxes[i-1].focus();
        }
    });
    box.addEventListener("paste", (e) => {
        e.preventDefault();
        const p = (e.clipboardData||window.clipboardData).getData("text").replace(/\D/g,"").slice(0,6);
        p.split("").forEach((ch,j) => { if(boxes[j]){boxes[j].value=ch;boxes[j].classList.add("filled");boxes[j].classList.remove("error");} });
        boxes[Math.min(p.length, boxes.length-1)].focus();
        if (p.length===6) setTimeout(submitCode,100);
    });
});

function getCode() { return Array.from(boxes).map(b=>b.value).join(""); }

// ── Timer ──
const TOTAL = 1*60;
let secs = TOTAL;

function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function updateBar() {
    const pct=(secs/TOTAL)*100;
    progressBar.style.width=pct+"%";
    if(pct<20) progressBar.classList.add("expired");
}

timerNum.textContent=fmt(secs); updateBar();

const interval = setInterval(()=>{
    secs--;
    timerNum.textContent=fmt(secs); updateBar();
    if(secs<=0){
        clearInterval(interval);
        timerDisp.classList.add("expired");
        timerNum.textContent="00:00";
        resendBtn.style.display="inline";
        setStatus("انتهت صلاحية الرمز. اضغط إعادة الإرسال.","error");
    }
},1000);

// ── Status ──
function setStatus(msg,type){
    const el=document.getElementById("statusMsg");
    el.textContent=msg; el.className="status-msg "+(type||"");
}

function markError(){
    boxes.forEach(b=>{b.classList.remove("filled");b.classList.add("error");b.value="";});
    setTimeout(()=>boxes.forEach(b=>b.classList.remove("error")),600);
    boxes[0].focus();
}

// ── Submit ──
async function submitCode(){
    const code=getCode();
    if(code.length<6){setStatus("الرجاء إدخال الرمز المكوّن من 6 أرقام","error");return;}
    if(!userId){setStatus("خطأ: انتهت الجلسة. أعد تسجيل الدخول.","error");return;}

    verifyBtn.disabled=true;
    verifyBtn.textContent="جارٍ التحقق...";

    try{
        const res=await fetch("/api/verify-otp",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({user_id:userId,otp:code,attempt_id:attemptId||null})
        });
        const data=await res.json();

        if(!res.ok){
            markError();
            setStatus(data.detail||"رمز غير صحيح، حاول مجدداً","error");
            verifyBtn.disabled=false; verifyBtn.textContent="تحقق من الرمز";
            return;
        }

        setStatus("✓ تم التحقق بنجاح! جارٍ تحميل الصفحة الرئيسية...","success");

        if(data.user_id){
            localStorage.setItem("user_id",     data.user_id);
            localStorage.setItem("username",    data.username    ||"");
            localStorage.setItem("role",        data.role        ||"");
            localStorage.setItem("first_name",  data.first_name  ||"");
            localStorage.setItem("last_name",   data.last_name   ||"");
            localStorage.setItem("email",       data.email       ||"");
            localStorage.setItem("phone",       data.phone       ||"");
            localStorage.setItem("national_id", data.national_id ||"");
        }

        sessionStorage.removeItem("otp_user_id");
        sessionStorage.removeItem("otp_attempt_id");
        sessionStorage.removeItem("otp_email");
        sessionStorage.removeItem("otp_risk_level");

        setTimeout(()=>{ window.location.href="/frontend/home.html"; },1500);

    }catch(err){
        setStatus("تعذّر الاتصال بالخادم","error");
        verifyBtn.disabled=false; verifyBtn.textContent="تحقق من الرمز";
    }
}

verifyBtn.addEventListener("click", submitCode);

// ── Resend ──
resendBtn.addEventListener("click", async()=>{
    if(!userEmail) return;
    resendBtn.style.display="none";
    setStatus("جارٍ إرسال رمز جديد...","success");
    try{
        const res=await fetch("/api/resend-otp",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({user_id:userId,email:userEmail})
        });
        const data=await res.json();
        if(!res.ok){setStatus(data.detail||"فشل الإرسال","error");resendBtn.style.display="inline";return;}
        setStatus("✓ تم إرسال رمز جديد إلى بريدك","success");
        secs=TOTAL; timerNum.textContent=fmt(secs);
        timerDisp.classList.remove("expired"); progressBar.classList.remove("expired"); updateBar();
        boxes.forEach(b=>{b.value="";b.classList.remove("filled","error");});
        boxes[0].focus();
    }catch{setStatus("تعذّر الاتصال بالخادم","error");resendBtn.style.display="inline";}
});

boxes[0]?.focus();
</script>
</body>
</html>
