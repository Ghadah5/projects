<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل مستخدم - سياق</title>
   
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

<!-- ANIMATED BACKGROUND -->
<div class="page-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="top-bar-container">
       <div class="top-bar-container">
        <div class="logo">
    <img src="/frontend/logo.png" alt="سياق" height="150">
</div>
        <nav class="nav-links">
             <a id="navHome" href="/frontend/home.html">الرئيسية</a>
            <a href="/frontend/about.html" id="navAbout">عن سياق</a>
            <a href="/frontend/login.html" href="#">تسجيل دخول</a>
        </nav>
        <div class="top-actions">
            <button class="lang-btn" id="btnAr" onclick="setLang('ar')">العربية</button>
            |
            <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
        </div>
    </div>
</header>

<!-- MAIN CONTENT -->
<div class="login-container">
    <h2 id="registerTitle">تسجيل مستخدم جديد</h2>

    <label for="idInput" id="idLabel">رقم الهوية أو الإقامة أو الحدود</label>
    <input type="text" id="idInput">

    <label for="firstNameInput" id="firstNameLabel">الاسم الأول</label>
    <input type="text" id="firstNameInput">

    <label for="lastNameInput" id="lastNameLabel">اسم العائلة</label>
    <input type="text" id="lastNameInput">

    <label for="mobileInput" id="mobileLabel">رقم الجوال</label>
    <input type="tel" id="mobileInput">

    <label for="emailInput" id="emailLabel">عنوان البريد الإلكتروني</label>
    <input type="email" id="emailInput">

    <label for="usernameInput" id="usernameLabel">اسم المستخدم</label>
    <input type="text" id="usernameInput">

    <label for="passwordInput" id="passwordLabel">كلمة المرور</label>
    <input type="password" id="passwordInput">

    <label for="confirmInput" id="confirmLabel">تأكيد كلمة المرور</label>
    <input type="password" id="confirmInput">

    <button class="btn" id="registerBtn">تسجيل</button>

    <div class="link">
        <a href="/frontend/login.html" id="backLogin">العودة لتسجيل الدخول</a>
    </div>
</div>

<script src="/frontend/validation.js"></script>
<script src="/frontend/register.js"></script>
<script src="/frontend/lang.js"></script>
</body>
</html>
