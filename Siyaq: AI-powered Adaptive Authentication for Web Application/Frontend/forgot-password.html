<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نسيت كلمة المرور</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

    
<!-- TOP BAR -->
<header class="top-bar">
    <div class="top-bar-container">
        <div class="logo">Logo</div>

        <nav class="nav-links">
             <a id="navHome" href="/frontend/home.html">الرئيسية</a>
            <a href="/frontend/about.html" id="navAbout">عن سياق</a>
            <a href="/frontend/login.html" href="#">تسجيل دخول</a>
        </nav>
        

        <div class="top-actions">
            <button class="lang-btn" id="btnAr" onclick="setLang('ar')">العربية</button> |
<button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>

        </div>
    </div>
</header>

<!-- MAIN CONTENT -->
<div class="container">
    <h2 id="forgotTitle">استعادة كلمة المرور</h2>

    <p class="helper-text" id="forgotText">
        أدخل بريدك الإلكتروني المسجّل، وسنرسل لك رابط إعادة تعيين كلمة المرور
    </p>
    

    <form id="forgotForm">
        <label for="email" id="forgotEmailLabel">البريد الإلكتروني</label>
        <input 
            type="email" 
            id="forgotEmail"
            placeholder="example@email.com"
            required
        >

        <button class="btn" type="submit" id="forgotBtn">
            إرسال رابط الاستعادة
        </button>
        
    </form>

    <div class="link">
        <a href="/frontend/login.html" id="backToLogin">← العودة لتسجيل الدخول</a>
    </div>
</div>

<script src="/frontend/lang.js"></script>
<script src="/frontend/forgot.js"></script>
</body>
</html>
